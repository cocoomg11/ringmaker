name: Release

# The user publishes a GitHub release tagged vMAJOR.MINOR.PATCH (agents never tag or publish). The build job (read-only) checks,
# sets version/URLs and builds module.zip. A separate upload job, the only one with write access, attaches module.json and
# module.zip to the release. Manual runs build the zip as a workflow artifact only.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build module.zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the release tag is vMAJOR.MINOR.PATCH
        if: github.event_name == 'release'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must look like v1.2.3"; exit 1
          fi

      - name: Vendored wanderers-core matches its pin
        run: node vendor/wanderers-core/vendor.mjs verify --remote

      - name: Unit tests
        run: npm test

      - name: Set version and URLs in module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles assets lang vendor LICENSE README.md CHANGELOG.md \
            -x 'vendor/wanderers-core/config/*' 'vendor/wanderers-core/vendor.mjs' 'vendor/wanderers-core/testing/*'
          for f in module.json scripts/main.mjs assets/token-ring.json styles/ringmaker.css vendor/wanderers-core/index.mjs vendor/wanderers-core/styles/wanderers-ui.css; do
            unzip -l module.zip | grep -q " $f$" || { echo "module.zip is missing $f"; exit 1; }
          done
          unzip -l module.zip

      - name: Keep module.json and module.zip for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module
          path: |
            module.json
            module.zip
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload the release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(jq -r .version dist/module.json)"
          test "v$V" = "$GITHUB_REF_NAME" || { echo "::error::module.json version $V doesn't match tag $GITHUB_REF_NAME"; exit 1; }
          sha256sum dist/module.zip
          gh release upload "$GITHUB_REF_NAME" dist/module.json dist/module.zip --clobber --repo "$GITHUB_REPOSITORY"
