name: Release

on:
  release:
    types: [published]
  # Manual run: builds module.zip as a workflow artifact without touching any release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the release tag is vMAJOR.MINOR.PATCH
        if: github.event_name == 'release'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must look like v1.2.3"; exit 1
          fi

      - name: Vendored wanderers-core matches its pin
        run: node vendor/wanderers-core/vendor.mjs verify --remote

      - name: Unit tests
        run: npm test

      - name: Set version and URLs in module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles assets lang vendor LICENSE README.md CHANGELOG.md \
            -x 'vendor/wanderers-core/config/*' 'vendor/wanderers-core/vendor.mjs' 'vendor/wanderers-core/testing/*'
          for f in module.json scripts/main.mjs assets/token-ring.json styles/ringmaker.css vendor/wanderers-core/index.mjs vendor/wanderers-core/styles/wanderers-ui.css; do
            unzip -l module.zip | grep -q " $f$" || { echo "module.zip is missing $f"; exit 1; }
          done
          unzip -l module.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber

      - name: Keep module.zip as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: module.zip
